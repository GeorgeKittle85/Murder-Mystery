<title>Sudden Death</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&family=Special+Elite&display=swap">
<style>
:root{
  /* Layout: full-bleed 3D view of the facility. Broadcast score bug top-left, minimap top-right.
     Evidence opens as a typed index card; the notebook is a dark playbook binder. One committed night look. */
  --night:#0a0d12;
  --panel:#10161e;
  --panel-hi:#18212c;
  --line:#2b3745;
  --chalk:#f0e9d8;
  --muted:#9ba6b2;
  --gold:#e6b450;
  --red:#d03c2f;
  --turf:#52a467;
  --paper:#ece3cb;
  --paper-line:#cdbf9c;
  --ink:#2b241b;
  --stamp:#b3261e;
  --scrim:rgba(6,9,13,.72);
  --font-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --font-body:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-file:"Special Elite","Courier New",Courier,monospace;
  --r:6px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--night);color:var(--chalk);font-family:var(--font-body);overflow:hidden}
body{-webkit-tap-highlight-color:transparent;font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--gold);outline-offset:2px}
kbd{font-family:var(--font-body);font-weight:700;font-size:.72em;letter-spacing:.04em;padding:.1em .45em;border-radius:4px;border:1px solid currentColor;opacity:.75;margin-left:.35em}
#app{position:relative;width:100%;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;background:var(--night)}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:5}
.scorebug{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));display:flex;align-items:stretch;background:rgba(10,13,18,.86);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-family:var(--font-display);text-transform:uppercase;box-shadow:0 6px 20px rgba(0,0,0,.35);max-width:calc(100% - 200px)}
.sb-chip{background:var(--red);color:var(--chalk);font-weight:900;font-size:20px;padding:6px 10px;display:flex;align-items:center;letter-spacing:.02em}
.sb-seg{display:flex;flex-direction:column;justify-content:center;padding:4px 12px;border-left:1px solid var(--line);min-width:0}
.sb-seg b{font-size:21px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--chalk)}
.sb-seg small{font-family:var(--font-body);font-size:9.5px;font-weight:700;letter-spacing:.14em;color:var(--muted)}
.sb-case{font-size:17px;font-weight:800;color:var(--gold);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sbDownSeg b{color:var(--gold)}
.room-banner{position:absolute;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translate(-50%,-8px);font-family:var(--font-display);font-weight:900;font-size:30px;letter-spacing:.08em;text-transform:uppercase;color:var(--chalk);opacity:0;transition:opacity .5s,transform .5s;text-shadow:0 2px 12px rgba(0,0,0,.7);white-space:nowrap;padding-bottom:4px;border-bottom:3px solid var(--gold)}
.room-banner.show{opacity:1;transform:translate(-50%,0)}
.map-wrap{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));width:168px;pointer-events:auto;cursor:pointer}
#minimap{display:block;width:168px;height:168px;border-radius:50%;background:rgba(10,13,18,.82);border:2px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.35)}
.map-room{display:block;text-align:center;margin-top:6px;font-family:var(--font-display);font-weight:800;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);text-shadow:0 1px 6px #000}
.crosshair{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--chalk);opacity:.7;box-shadow:0 0 0 2px rgba(0,0,0,.35);transition:transform .15s,background .15s}
.crosshair.hot{background:var(--gold);transform:scale(1.8);opacity:1}
.prompt{position:absolute;left:50%;bottom:calc(16% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(10,13,18,.88);border:1px solid var(--gold);color:var(--chalk);padding:8px 16px;border-radius:999px;font-weight:600;font-size:16px;white-space:nowrap;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.prompt kbd{margin:0;background:var(--gold);color:var(--night);border-color:var(--gold);opacity:1;font-size:.8em}
.prompt .new{font-family:var(--font-display);font-weight:800;font-size:12px;letter-spacing:.1em;color:var(--night);background:var(--chalk);border-radius:3px;padding:1px 5px}
.toasts{position:absolute;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:min(92vw,420px)}
.toast{background:var(--paper);color:var(--ink);border-radius:4px;padding:8px 14px;font-family:var(--font-file);font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.45);display:flex;gap:10px;align-items:center;animation:toastIn .35s ease-out both;max-width:100%}
.toast .tk{font-family:var(--font-display);font-weight:900;font-size:13px;letter-spacing:.12em;color:var(--stamp);border:2px solid var(--stamp);padding:0 5px;border-radius:3px;transform:rotate(-4deg);white-space:nowrap}
.toast.gold{background:var(--gold);color:var(--night)}
.toast.gold .tk{color:var(--night);border-color:var(--night)}
.toast.dark{background:rgba(10,13,18,.92);color:var(--chalk);border:1px solid var(--line);font-family:var(--font-body)}
.toast.dark .tk{color:var(--gold);border-color:var(--gold)}
.toast.out{animation:toastOut .4s ease-in both}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-8px)}}
.hud-actions{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;pointer-events:auto}
.hud-btn{background:rgba(10,13,18,.86);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;font-weight:600;font-size:14px;color:var(--chalk)}
.hud-btn:hover{border-color:var(--gold)}
.resume-hint{position:absolute;left:50%;top:50%;transform:translate(-50%,24px);background:rgba(10,13,18,.85);border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--chalk)}
.hint-strip{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:12.5px;color:var(--muted);background:rgba(10,13,18,.7);padding:6px 10px;border-radius:var(--r);max-width:min(60vw,560px)}
.hint-strip b{color:var(--chalk);font-weight:600}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;mix-blend-mode:screen}
.hutt{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--font-display);font-weight:900;font-size:64px;color:var(--chalk);letter-spacing:.06em;text-shadow:0 4px 18px rgba(0,0,0,.6);pointer-events:none;animation:hut .6s ease-out both}
@keyframes hut{from{opacity:0;transform:translate(-50%,-50%) scale(.6)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}to{opacity:0;transform:translate(-50%,-70%) scale(1)}}

/* touch */
#touchUI{position:absolute;inset:0;pointer-events:none}
#touchLayer{position:absolute;inset:0;pointer-events:auto}
.joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(240,233,216,.35);background:rgba(10,13,18,.3);pointer-events:none;opacity:0;transition:opacity .15s}
.joy.on{opacity:1}
.joy-knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(240,233,216,.75)}
.joy-ghost{position:absolute;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--muted);pointer-events:none}
.t-btn{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid var(--line);background:rgba(10,13,18,.82);color:var(--chalk);font-family:var(--font-display);font-weight:900;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1}
.t-act{right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(120px + env(safe-area-inset-bottom,0px));width:92px;height:92px;font-size:17px;border-color:var(--gold);background:var(--gold);color:var(--night);padding:6px}
.t-block{right:calc(120px + env(safe-area-inset-right,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));width:66px;height:66px;font-size:15px}
.t-run{right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));width:0;height:0;display:none}
.touch .hud-actions{bottom:auto;right:auto;left:calc(12px + env(safe-area-inset-left,0px));top:calc(66px + env(safe-area-inset-top,0px))}
.touch .hud-btn kbd{display:none}
.touch .hint-strip{display:none}

/* ---------- Screens & overlays ---------- */
.screen{position:absolute;inset:0;z-index:20;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.overlay{position:absolute;inset:0;z-index:15;touch-action:pan-y}
.overlay.center{display:flex;align-items:center;justify-content:center;background:var(--scrim);padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.overlay.bottom{display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(to top,rgba(6,9,13,.85),rgba(6,9,13,0) 70%);padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.overlay.full{background:rgba(6,9,13,.9);display:flex;justify-content:center;padding:calc(10px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}

/* title */
.title{background:radial-gradient(120% 90% at 85% 50%,rgba(10,13,18,0) 0%,rgba(10,13,18,.55) 55%,rgba(10,13,18,.92) 100%),linear-gradient(90deg,rgba(10,13,18,.92) 0%,rgba(10,13,18,.45) 60%,rgba(10,13,18,.2) 100%)}
.title-inner{max-width:760px;padding-block:calc(28px + env(safe-area-inset-top,0px)) 28px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;min-height:100%;justify-content:center}
.eyebrow{margin:0;font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.logo{margin:0;font-family:var(--font-display);font-weight:900;text-transform:uppercase;line-height:.8;font-size:clamp(76px,15vw,176px);letter-spacing:-.01em;display:flex;flex-direction:column}
.logo span{display:block}
.logo-death{color:var(--red);position:relative;padding-bottom:.08em;background:repeating-linear-gradient(90deg,var(--chalk) 0 6px,transparent 6px 22px) left bottom/100% 5px no-repeat;width:max-content;max-width:100%}
.tagline{margin:0;max-width:56ch;font-size:17px;color:var(--chalk);opacity:.9;text-wrap:pretty}
.tagline b{color:var(--gold);font-weight:600}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mode-card{text-align:left;background:rgba(16,22,30,.88);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s,background .15s;min-width:0}
.mode-card:hover{border-color:var(--gold);transform:translateY(-2px);background:rgba(24,33,44,.92)}
.mode-kicker{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.mode-name{font-family:var(--font-display);font-weight:900;font-size:34px;line-height:.95;text-transform:uppercase;color:var(--chalk)}
.mode-card:first-child .mode-name{color:var(--gold)}
.mode-desc{font-size:14px;color:var(--chalk);opacity:.85}
.mode-meta{font-size:12px;font-weight:600;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.title-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip-btn{background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13.5px;color:var(--chalk);display:inline-flex;gap:8px;align-items:center}
.chip-btn:hover{border-color:var(--gold)}
.chip-btn input[type=range]{width:96px;accent-color:var(--gold)}
.tip{margin:0;font-size:13px;color:var(--muted);min-height:1.4em}
.tip b{color:var(--gold);font-weight:600}
.how{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.how-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);max-width:640px;width:100%;padding:22px;max-height:100%;overflow:auto}
.how-card h2{font-family:var(--font-display);font-weight:900;text-transform:uppercase;font-size:34px;margin:0 0 8px;line-height:1}
.how-card h3{font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:16px;color:var(--gold);margin:16px 0 6px}
.how-card p,.how-card li{font-size:14.5px;color:var(--chalk);opacity:.9}
.how-card ul{margin:0;padding-left:18px;display:grid;gap:4px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;align-items:baseline}
.keys kbd{margin:0;opacity:1;border-color:var(--line);background:var(--panel-hi);white-space:nowrap}

/* briefing (case file on paper) */
.brief{display:flex;align-items:center;justify-content:center;background:var(--scrim);padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.case-file{background:var(--paper);color:var(--ink);max-width:660px;width:100%;border-radius:3px;padding:26px 28px 22px;box-shadow:0 20px 60px rgba(0,0,0,.6);background-image:repeating-linear-gradient(to bottom,transparent 0 27px,rgba(120,100,60,.13) 27px 28px);position:relative;margin:auto}
.cf-head{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.cf-no{font-family:var(--font-file);font-size:14px;letter-spacing:.06em}
.cf-stamp{font-family:var(--font-display);font-weight:900;font-size:16px;letter-spacing:.14em;color:var(--stamp);border:3px solid var(--stamp);padding:1px 8px;border-radius:3px;transform:rotate(-5deg)}
.case-file h2{font-family:var(--font-display);font-weight:900;text-transform:uppercase;font-size:clamp(36px,7vw,54px);line-height:.95;margin:14px 0 10px;color:var(--ink);text-wrap:balance}
.cf-body{font-family:var(--font-file);font-size:15.5px;line-height:1.6;display:grid;gap:10px}
.cf-body p{margin:0}
.cf-body .em{color:var(--stamp)}
.cf-goal{border:2px dashed var(--ink);padding:10px 12px;border-radius:3px}
.cf-controls{margin-top:14px;font-size:13.5px;font-family:var(--font-body);color:var(--ink);opacity:.85;display:flex;flex-wrap:wrap;gap:6px 14px}
.cf-controls kbd{color:var(--ink)}
.cf-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn-primary{background:var(--red);color:var(--chalk);border:0;border-radius:var(--r);padding:12px 20px;font-family:var(--font-display);font-weight:900;font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.btn-primary:hover{filter:brightness(1.1)}
.btn-ghost{background:transparent;border:1px solid currentColor;border-radius:var(--r);padding:11px 18px;font-weight:600;font-size:15px}
.case-file .btn-ghost{color:var(--ink)}

/* evidence card */
.evidence-card{background:var(--paper);color:var(--ink);width:min(560px,100%);border-radius:3px;padding:20px 22px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);background-image:linear-gradient(to bottom,transparent 46px,rgba(179,38,30,.45) 46px 47px,transparent 47px),repeating-linear-gradient(to bottom,transparent 0 25px,rgba(70,110,160,.16) 25px 26px);animation:cardIn .25s ease-out both;margin:auto}
@keyframes cardIn{from{opacity:0;transform:translateY(12px) rotate(-.6deg)}to{opacity:1;transform:none}}
.ev-room{margin:0 0 2px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.7}
.evidence-card h3{margin:0 0 12px;font-family:var(--font-display);font-weight:900;font-size:28px;text-transform:uppercase;line-height:1}
.ev-text{font-family:var(--font-file);font-size:16px;line-height:1.6;min-height:3em;white-space:pre-wrap}
.ev-text .log{white-space:normal;display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;font-size:13.5px;line-height:1.45;margin:8px 0;padding:8px 10px;background:rgba(43,36,27,.07);border-radius:3px;overflow-x:auto}
.ev-text .log span{white-space:nowrap}
.ev-text .log .bad{color:var(--stamp)}
.ev-text .log .sys{grid-column:1/-1;opacity:.75;font-size:12.5px}
.ev-logged{display:flex;align-items:center;gap:10px;margin-top:12px;font-family:var(--font-file);font-size:14.5px}
.ev-stamp{font-family:var(--font-display);font-weight:900;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--stamp);border:3px solid var(--stamp);border-radius:3px;padding:1px 8px;transform:rotate(-4deg);animation:stamp .35s cubic-bezier(.2,1.8,.4,1) both;white-space:nowrap}
@keyframes stamp{from{opacity:0;transform:scale(1.8) rotate(-12deg)}to{opacity:1;transform:rotate(-4deg)}}
.ev-quip{margin:12px 0 0;font-size:14px;font-style:italic;color:#5a4a33}
.ev-quip:empty{display:none}
.btn-paper{margin-top:14px;background:var(--ink);color:var(--paper);border:0;border-radius:4px;padding:9px 16px;font-weight:700;font-size:14.5px}
.btn-paper kbd{color:var(--paper)}

/* dialogue */
.dlg{width:min(780px,100%);background:rgba(16,22,30,.97);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:0 -10px 40px rgba(0,0,0,.4);max-height:72vh;overflow:auto;animation:cardIn .25s ease-out both}
.dlg-head{display:flex;align-items:center;gap:12px}
.dlg-head > div:not(.portrait){min-width:0;flex:1}
.portrait{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:900;font-size:22px;flex:none;border:2px solid var(--chalk)}
.dlg h3{margin:0;font-family:var(--font-display);font-weight:900;font-size:26px;text-transform:uppercase;line-height:1}
.dlg-head p{margin:2px 0 0;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.x{background:transparent;border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;font-size:13px;font-weight:600;color:var(--chalk);flex:none}
.x:hover{border-color:var(--gold)}
.dlg-text{margin:12px 0 0;font-size:17.5px;line-height:1.5;min-height:2.6em;text-wrap:pretty}
.dlg-text .q{display:block;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.dlg-obs{margin:10px 0 0;font-size:13px;color:var(--muted);border-left:2px solid var(--gold);padding-left:10px}
.dlg-obs:empty{display:none}
.dlg-obs b{color:var(--chalk);font-weight:600}
.dlg-topics{display:grid;gap:6px;margin-top:12px}
.topic{text-align:left;background:var(--panel-hi);border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;font-size:15px;display:flex;gap:10px;align-items:baseline}
.topic:hover{border-color:var(--gold)}
.topic .n{font-family:var(--font-display);font-weight:900;color:var(--gold);min-width:1.1em}
.topic.asked{opacity:.55}
.topic.asked .n{color:var(--muted)}
.topic .tag{margin-left:auto;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--night);background:var(--gold);border-radius:3px;padding:1px 5px;white-space:nowrap}

/* notebook */
.nb{width:min(1060px,100%);height:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden;animation:cardIn .2s ease-out both}
.nb-head{display:flex;align-items:center;gap:14px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
